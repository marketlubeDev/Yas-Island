<svg width="300" height="600" viewBox="0 0 300 600" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Purple gradient background -->
    <linearGradient id="purpleGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="50%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#6D28D9"/>
    </linearGradient>
    
    <!-- Subtle overlay gradient -->
    <linearGradient id="overlayGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.1)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.05)"/>
    </linearGradient>
    
    <!-- Clip path for ticket shape -->
    <clipPath id="ticketClip">
      <path d="M20 20 L280 20 Q290 20 290 30 L290 200 Q290 210 280 210 L270 210 Q260 210 260 220 Q260 230 270 230 L280 230 Q290 230 290 240 L290 570 Q290 580 280 580 L20 580 Q10 580 10 570 L10 240 Q10 230 20 230 L30 230 Q40 230 40 220 Q40 210 30 210 L20 210 Q10 210 10 200 L10 30 Q10 20 20 20 Z"/>
    </clipPath>
  </defs>
  
  <!-- Main ticket background -->
  <rect width="300" height="600" fill="url(#purpleGradient)" clip-path="url(#ticketClip)"/>
  
  <!-- Overlay gradient -->
  <rect width="300" height="600" fill="url(#overlayGradient)" clip-path="url(#ticketClip)"/>
  
  <!-- Decorative curved lines -->
  <path d="M50 80 Q150 60 250 80" stroke="rgba(255,255,255,0.2)" stroke-width="2" fill="none"/>
  <path d="M30 100 Q150 85 270 100" stroke="rgba(255,255,255,0.15)" stroke-width="1.5" fill="none"/>
  
  <!-- QR Code placeholder (simplified pattern) -->
  <g transform="translate(100, 120)">
    <rect width="100" height="100" fill="white" rx="4"/>
    <!-- QR code pattern simulation -->
    <rect x="8" y="8" width="12" height="12" fill="black"/>
    <rect x="24" y="8" width="4" height="4" fill="black"/>
    <rect x="32" y="8" width="8" height="8" fill="black"/>
    <rect x="44" y="8" width="4" height="4" fill="black"/>
    <rect x="52" y="8" width="12" height="12" fill="black"/>
    <rect x="68" y="8" width="8" height="8" fill="black"/>
    <rect x="80" y="8" width="12" height="12" fill="black"/>
    
    <rect x="8" y="24" width="4" height="4" fill="black"/>
    <rect x="16" y="24" width="8" height="8" fill="black"/>
    <rect x="28" y="24" width="4" height="4" fill="black"/>
    <rect x="36" y="24" width="12" height="12" fill="black"/>
    <rect x="52" y="24" width="4" height="4" fill="black"/>
    <rect x="60" y="24" width="8" height="8" fill="black"/>
    <rect x="72" y="24" width="4" height="4" fill="black"/>
    <rect x="80" y="24" width="12" height="12" fill="black"/>
    
    <rect x="8" y="40" width="8" height="8" fill="black"/>
    <rect x="20" y="40" width="4" height="4" fill="black"/>
    <rect x="28" y="40" width="12" height="12" fill="black"/>
    <rect x="44" y="40" width="8" height="8" fill="black"/>
    <rect x="56" y="40" width="4" height="4" fill="black"/>
    <rect x="64" y="40" width="12" height="12" fill="black"/>
    <rect x="80" y="40" width="8" height="8" fill="black"/>
    
    <rect x="8" y="56" width="4" height="4" fill="black"/>
    <rect x="16" y="56" width="12" height="12" fill="black"/>
    <rect x="32" y="56" width="8" height="8" fill="black"/>
    <rect x="44" y="56" width="4" height="4" fill="black"/>
    <rect x="52" y="56" width="12" height="12" fill="black"/>
    <rect x="68" y="56" width="4" height="4" fill="black"/>
    <rect x="76" y="56" width="8" height="8" fill="black"/>
    
    <rect x="8" y="72" width="12" height="12" fill="black"/>
    <rect x="24" y="72" width="8" height="8" fill="black"/>
    <rect x="36" y="72" width="4" height="4" fill="black"/>
    <rect x="44" y="72" width="12" height="12" fill="black"/>
    <rect x="60" y="72" width="8" height="8" fill="black"/>
    <rect x="72" y="72" width="4" height="4" fill="black"/>
    <rect x="80" y="72" width="12" height="12" fill="black"/>
    
    <!-- Corner markers -->
    <rect x="8" y="8" width="20" height="20" fill="none" stroke="black" stroke-width="2"/>
    <rect x="72" y="8" width="20" height="20" fill="none" stroke="black" stroke-width="2"/>
    <rect x="8" y="72" width="20" height="20" fill="none" stroke="black" stroke-width="2"/>
  </g>
  
  <!-- "SCAN HERE!" text -->
  <text x="150" y="245" text-anchor="middle" fill="rgba(255,255,255,0.8)" font-family="Arial, sans-serif" font-size="12" font-weight="300">SCAN HERE!</text>
  
  <!-- Main title "FERRARI WORLD" -->
  <!-- <text x="150" y="280" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="28" font-weight="bold" letter-spacing="2px">FERRARI WORLD</text> -->
  
  <!-- Subtitle "ONE DAY TICKET" -->
  <text x="150" y="305" text-anchor="middle" fill="rgba(255,255,255,0.9)" font-family="Arial, sans-serif" font-size="16" font-weight="300" letter-spacing="1px">TICKET</text>
  
  <!-- Decorative line -->
  <line x1="60" y1="325" x2="240" y2="325" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
  
  <!-- "DETAILS INFORMATION" -->
  <text x="150" y="350" text-anchor="middle" fill="rgba(255,255,255,0.7)" font-family="Arial, sans-serif" font-size="12" font-weight="bold">DETAILS INFORMATION</text>
  
  <!-- Details text -->
  <text x="150" y="370" text-anchor="middle" fill="rgba(255,255,255,0.6)" font-family="Arial, sans-serif" font-size="10">Lorem ipsum dolor sit amet, consectetur</text>
  <text x="150" y="385" text-anchor="middle" fill="rgba(255,255,255,0.6)" font-family="Arial, sans-serif" font-size="10">adipiscing elit, sed diam nonummy nibh</text>
  <text x="150" y="400" text-anchor="middle" fill="rgba(255,255,255,0.6)" font-family="Arial, sans-serif" font-size="10">euismod tincidunt ut laoreet dolore magna</text>
  
  <!-- Code section -->
  <text x="60" y="430" fill="white" font-family="Arial, sans-serif" font-size="14" font-weight="bold">XXXXX XXXXXXXXXXXXXXX</text>
  <text x="60" y="450" fill="rgba(255,255,255,0.8)" font-family="Arial, sans-serif" font-size="12" font-weight="bold">CODE</text>
  <text x="120" y="450" fill="white" font-family="Arial, sans-serif" font-size="12" font-weight="bold">FE33P1K</text>
  
  <!-- Bottom image placeholder -->
  <rect x="30" y="480" width="240" height="100" fill="#4A90E2" rx="8"/>
  <rect x="30" y="480" width="240" height="40" fill="url(#overlayGradient)" rx="8"/>
  
  <!-- Simulate landscape image -->
  <circle cx="80" cy="520" r="15" fill="#FFD700" opacity="0.8"/>
  <path d="M40 540 Q80 520 120 530 Q160 525 200 535 Q230 540 260 545" stroke="#87CEEB" stroke-width="3" fill="none"/>
  <path d="M40 550 Q90 535 140 540 Q180 538 220 545 Q250 550 270 555" stroke="#4682B4" stroke-width="2" fill="none"/>
  
  <!-- Ticket perforations -->
  <g opacity="0.3">
    <circle cx="10" cy="220" r="2" fill="white"/>
    <circle cx="290" cy="220" r="2" fill="white"/>
    <circle cx="20" cy="220" r="1" fill="white"/>
    <circle cx="280" cy="220" r="1" fill="white"/>
    <circle cx="30" cy="220" r="1" fill="white"/>
    <circle cx="270" cy="220" r="1" fill="white"/>
  </g>
</svg>
