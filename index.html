<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/fav.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="supported-color-schemes" content="light dark" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="robots" content="index, follow" />
    <meta
      name="description"
      content="Yas Island is a family-friendly entertainment hub with theme parks, attractions, and experiences. Book your holiday, tickets, and experiences now."
    />
    <meta name="theme-color" content="#231942" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="YAS ISLAND" />
    <meta
      property="og:title"
      content="YAS ISLAND | World-class family entertainment destination"
    />
    <meta
      property="og:description"
      content="Plan and book unforgettable experiences across Yas Island's attractions, parks, and events."
    />
    <meta property="og:image" content="/fav.png" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="YAS ISLAND | World-class family entertainment destination"
    />
    <meta
      name="twitter:description"
      content="Plan and book unforgettable experiences across Yas Island's attractions, parks, and events."
    />
    <meta name="twitter:image" content="/fav.png" />

    <!-- Icons -->
    <link rel="apple-touch-icon" href="/fav.png" />

    <!-- Performance: harmless DNS prefetch / preconnect hints for third-party services -->
    <link rel="dns-prefetch" href="//prod15-live-chat.sprinklr.com" />
    <link
      rel="preconnect"
      href="https://prod15-live-chat.sprinklr.com"
      crossorigin
    />
    <link rel="dns-prefetch" href="//static-na.payments-amazon.com" />
    <link
      rel="preconnect"
      href="https://static-na.payments-amazon.com"
      crossorigin
    />
    <link rel="dns-prefetch" href="//checkout.payfort.com" />
    <link rel="preconnect" href="https://checkout.payfort.com" crossorigin />
    <link rel="dns-prefetch" href="//sbcheckout.payfort.com" />
    <link rel="preconnect" href="https://sbcheckout.payfort.com" crossorigin />

    <title>
      YAS ISLAND | Yas Island, one of the most popular tourist attractions in
      the world, presents a family-friendly entertainment hub like no other.
      Book your holiday today.
    </title>
    <!-- font by local -->
    <link rel="stylesheet" href="styles/fonts.css" />

    <!-- Structured Data: Organization and WebSite -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "YAS ISLAND",
        "url": "/",
        "logo": "/fav.png"
      }
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "YAS ISLAND",
        "url": "/"
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
