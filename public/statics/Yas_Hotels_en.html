    <script>
      // Function to detect and apply color scheme
      function applyColorScheme() {
        const isDarkMode = window.matchMedia(
          "(prefers-color-scheme: dark)"
        ).matches;
        const html = document.documentElement;
        const body = document.body;

        if (isDarkMode) {
          html.classList.add("dark-mode");
          body.style.setProperty("--bg-color", "#0b0c0c");
          body.style.setProperty("--text-color", "#ffffff");
          body.style.setProperty("--text-secondary", "#cccccc");
          body.style.setProperty("--card-bg", "#1a1a1a");
        } else {
          html.classList.remove("dark-mode");
          body.style.removeProperty("--bg-color");
          body.style.removeProperty("--text-color");
          body.style.removeProperty("--text-secondary");
          body.style.removeProperty("--card-bg");
        }
      }

      // Apply color scheme on page load
      document.addEventListener("DOMContentLoaded", applyColorScheme);
      applyColorScheme();

      // Listen for color scheme changes
      if (window.matchMedia) {
        const mediaQuery = window.matchMedia("(prefers-color-scheme: dark)");

        // For older browsers that don't support addEventListener
        if (mediaQuery.addListener) {
          mediaQuery.addListener(applyColorScheme);
        } else if (mediaQuery.addEventListener) {
          mediaQuery.addEventListener("change", applyColorScheme);
        }
      }

      // Force update on iOS Safari
      if (/iPad|iPhone|iPod/.test(navigator.userAgent)) {
        // Additional iOS-specific handling
        setTimeout(applyColorScheme, 100);
        setTimeout(applyColorScheme, 500);

        // Listen for visibility change (when user switches apps and comes back)
        document.addEventListener("visibilitychange", function () {
          if (!document.hidden) {
            setTimeout(applyColorScheme, 100);
          }
        });
      }

      // Additional fallback for immediate application
      window.addEventListener("load", applyColorScheme);
    </script>

      function getImageFromRaw(rawImages) {
        if (!rawImages) return "";
        try {
          const images = JSON.parse(rawImages);
          const first = images && images[0];
          return (
            (first && first.desktopImage && first.desktopImage.src) ||
            (first && first.tabletImage && first.tabletImage.src) ||
            (first && first.mobileImage && first.mobileImage.src) ||
            ""
          );
        } catch (e) {
          return "";
        }
      }

      function getLinkFromRaw(rawLink, fallbackHref) {
        if (!rawLink)
          return {
            href: fallbackHref || "#",
            label: "VIEW RESTAURANT",
            target: "",
          };
        try {
          const link = JSON.parse(rawLink);
          return {
            href: link.Href || link.href || fallbackHref || "#",
            label: (link.Label || "VIEW RESTAURANT").trim(),
            target: link.Target || "",
          };
        } catch (e) {
          // Try to parse from embedded HTML
          const m = String(rawLink).match(
            /href=['"]([^'\"]+)['"][^>]*>(.*?)</i
          );
          return {
            href: (m && m[1]) || fallbackHref || "#",
            label: (m && m[2]) || "VIEW RESTAURANT",
            target: String(rawLink).includes("target='_blank'") ? "_blank" : "",
          };
        }
      }

      function createCardNode(item) {
        const title =

        const desc = (item.raw && item.raw.fdescription32545) || "";

        );

        const article = document.createElement("article");

        const imgDiv = document.createElement("div");

        if (img) imgDiv.style.backgroundImage = `url('${img}')`;

        const dot = document.createElement("span");

        ul.appendChild(li);
        const a = document.createElement("a");

        body.appendChild(p);
        body.appendChild(ul);
        body.appendChild(a);

        article.appendChild(imgDiv);
        article.appendChild(body);
        return article;

      function readInlineData() {
        const el = document.getElementById("restaurants-data");
        if (el && el.textContent && el.textContent.trim()) {
          try {
            const parsed = JSON.parse(el.textContent);
            if (Array.isArray(parsed) && parsed.length) return parsed;
          } catch (e) {}
        }
        return null;
      }

      function renderRestaurants() {
        const grid = document.querySelector(".cards-grid");
        const subtitle = document.querySelector(".explore-subtitle");
        if (!grid) return;
        const data = readInlineData() || restaurantsData;
        grid.innerHTML = "";
        data.forEach((item) => {
          grid.appendChild(createCardNode(item));
        });
        if (subtitle) {
          subtitle.textContent = `${data.length} restaurants`;
        }
      }
