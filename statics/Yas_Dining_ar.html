<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>مرحبًا — Centered Arabic</title>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
      }

      /* Center horizontally and vertically */
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f7f7f7;
        font-family: "Segoe UI", Roboto, "Noto Naskh Arabic", "Arial",
          sans-serif;
      }

      .greeting {
        font-size: 4rem; /* adjust size as needed */
        font-weight: 700;
        line-height: 1;
        text-align: center;
        color: #1f2937;
        padding: 0.5rem 1rem;
        border-radius: 12px;
        background: rgba(255, 255, 255, 0.6);
        box-shadow: 0 6px 20px rgba(0, 0, 0, 0.06);
      }
    </style>
  </head>
  <body>
    <div class="greeting">مرحبًا</div>
  </body>
</html>
