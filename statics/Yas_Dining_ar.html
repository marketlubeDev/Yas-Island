    <script>
      // Function to detect and apply color scheme
      function applyColorScheme() {
        const isDarkMode = window.matchMedia(
          "(prefers-color-scheme: dark)"
        ).matches;
        const html = document.documentElement;
        const body = document.body;

        if (isDarkMode) {
          html.classList.add("dark-mode");
          body.style.setProperty("--bg-color", "#0b0c0c");
          body.style.setProperty("--text-color", "#ffffff");
          body.style.setProperty("--text-secondary", "#cccccc");
          body.style.setProperty("--card-bg", "#1a1a1a");
        } else {
          html.classList.remove("dark-mode");
          body.style.removeProperty("--bg-color");
          body.style.removeProperty("--text-color");
          body.style.removeProperty("--text-secondary");
          body.style.removeProperty("--card-bg");
        }
      }

      // Apply color scheme on page load
      document.addEventListener("DOMContentLoaded", applyColorScheme);
      applyColorScheme();

      // Listen for color scheme changes
      if (window.matchMedia) {
        const mediaQuery = window.matchMedia("(prefers-color-scheme: dark)");

        // For older browsers that don't support addEventListener
        if (mediaQuery.addListener) {
          mediaQuery.addListener(applyColorScheme);
        } else if (mediaQuery.addEventListener) {
          mediaQuery.addEventListener("change", applyColorScheme);
        }
      }

      // Force update on iOS Safari
      if (/iPad|iPhone|iPod/.test(navigator.userAgent)) {
        // Additional iOS-specific handling
        setTimeout(applyColorScheme, 100);
        setTimeout(applyColorScheme, 500);

        // Listen for visibility change (when user switches apps and comes back)
        document.addEventListener("visibilitychange", function () {
          if (!document.hidden) {
            setTimeout(applyColorScheme, 100);
          }
        });
      }

      // Additional fallback for immediate application
      window.addEventListener("load", applyColorScheme);
    </script>
    <script>
      (function () {
        try {
          var keys = [
            "persist:yasIslandAccessibility",
            "yasIslandAccessibility",
          ];
          var raw = null;
          for (var i = 0; i < keys.length; i++) {
            raw = localStorage.getItem(keys[i]);
            if (raw) break;
          }
          function parsePersisted(value) {
            try {
              return JSON.parse(value);
            } catch (e) {
              return {};
            }
          }
          function coerce(v) {
            if (typeof v === "string") {
              try {
                return JSON.parse(v);
              } catch (e) {
                return v;
              }
            }
            return v;
          }
          function applyTheme(dark) {
            var root = document.documentElement;
            root.classList.remove("theme-light", "theme-dark");
            root.classList.add(dark ? "theme-dark" : "theme-light");
            root.style.colorScheme = dark ? "dark" : "light";
          }
          function applyZoom(zoomLevel) {
            var root = document.documentElement;
            var scale = 1;
            if (zoomLevel === 1 || zoomLevel === "1") {
              scale = 1;
            } else if (zoomLevel === 1.12 || zoomLevel === "1.12") {
              scale = 1.12;
            } else if (zoomLevel === 1.25 || zoomLevel === "1.25") {
              scale = 1.25;
            } else if (typeof zoomLevel === "number") {
              scale = zoomLevel;
            }
            root.style.setProperty("--zoom-scale", String(scale));
          }
          if (raw) {
            var data = parsePersisted(raw);
            var theme = coerce(data.theme);
            var isDark = coerce(data.isDarkMode);
            var zoom = coerce(data.zoomLevel);
            var dark = theme === "theme-dark" || isDark === true;
            applyTheme(dark);
            applyZoom(zoom);
          }
          window.addEventListener("storage", function (e) {
            if (!keys.includes(e.key)) return;
            var data = parsePersisted(e.newValue || "{}");
            var theme = coerce(data.theme);
            var isDark = coerce(data.isDarkMode);
            var zoom = coerce(data.zoomLevel);
            applyTheme(theme === "theme-dark" || isDark === true);
            applyZoom(zoom);
          });
        } catch (err) {}
      })();
    </script>

        const ar = AR_OVERRIDES[keyId] || AR_OVERRIDES[keyTitle];
        const titleMapped = AR_TITLES[keyTitle] || title;
        const arTitle = (ar && ar.title) || titleMapped;
        const arDesc = (ar && ar.desc) || autoTranslateEnglishToArabic(desc);
        const arLocation = translateLocationToArabic(location);
        const img = getImageFromRaw(
          item.raw && item.raw.fmorepackagecardimages32545
        );
        const book = getLinkFromRaw(
          item.raw &&
            (item.raw.fmorepackagebooknowlink32545 ||
              item.raw.fmorepackagelink32545),
          item.clickUri || item.ClickUri || "#"
        );

        const article = document.createElement("article");
        article.className = "card";

        const imgDiv = document.createElement("div");
        imgDiv.className = "card-image";
        if (img) {
          const imgEl = document.createElement("img");
          imgEl.src = img;
          imgEl.alt = arTitle || "";
          imgDiv.appendChild(imgEl);
        }
        // Removed favorite button (heart icon)

        const body = document.createElement("div");
        body.className = "card-body";
        const h3 = document.createElement("h3");
        h3.className = "card-title";
        h3.textContent = arTitle;
        const p = document.createElement("p");
        p.className = "card-desc";
        p.textContent = arDesc;
        const ul = document.createElement("ul");
        ul.className = "card-meta";
        const li = document.createElement("li");
        const dot = document.createElement("span");
        dot.className = "geo";
        dot.innerHTML =
          '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="#2d5a4a" width="16" height="16"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg>';
        li.appendChild(dot);
        li.appendChild(document.createTextNode(" " + arLocation));
        ul.appendChild(li);
        const a = document.createElement("a");
        a.className = "card-cta";
        a.href = book.href || "#";
        a.target = book.target || "_blank";
        a.rel = "noopener noreferrer";
        a.textContent = "عرض المطعم";

        body.appendChild(h3);
        body.appendChild(p);
        body.appendChild(ul);
        body.appendChild(a);

        article.appendChild(imgDiv);
        article.appendChild(body);
        return article;
      }

      function readInlineData() {
        const el = document.getElementById("restaurants-data");
        if (el && el.textContent && el.textContent.trim()) {
          try {
            const parsed = JSON.parse(el.textContent);
            if (Array.isArray(parsed) && parsed.length) return parsed;
          } catch (e) {}
        }
        return null;
      }

      function renderRestaurants() {
        const grid = document.querySelector(".cards-grid");
        const subtitle = document.querySelector(".explore-subtitle");
        if (!grid) return;
        const data = readInlineData() || restaurantsData;
        grid.innerHTML = "";
        data.forEach((item) => {
          grid.appendChild(createCardNode(item));
        });
        if (subtitle) {
          subtitle.textContent = `${data.length} مطاعم`;
        }

        // Post-render Arabic override pass (mirrors hotels approach)
        try {
          const normalize = (s) =>
            (s || "")
              .toLowerCase()
              .replace(/[\u2019\u2018]/g, "'")
              .replace(/[\u201C\u201D]/g, '"')
              .replace(/\s+/g, " ")
              .trim();

          document.querySelectorAll(".card").forEach((card) => {
            const nameEl = card.querySelector(".card-title");
            const descEl = card.querySelector(".card-desc");
            const locEl = card.querySelector(".card-meta li");
            const key = normalize(nameEl && nameEl.textContent);

            // Name mapping
            if (AR_TITLES[key]) {
              nameEl.textContent = AR_TITLES[key];
            }

            // Description mapping or fallback auto translate
            if (descEl) {
              const over =
                AR_OVERRIDES[key] ||
                AR_OVERRIDES[
                  nameEl.textContent && nameEl.textContent.toLowerCase()
                ];
              if (over && over.desc) {
                descEl.textContent = over.desc;
              } else {
                descEl.textContent = autoTranslateEnglishToArabic(
                  descEl.textContent || ""
                );
              }
            }

            // Location normalization to Arabic
            if (locEl && locEl.childNodes && locEl.childNodes.length > 1) {
              const textNode = locEl.childNodes[1];
              if (textNode && textNode.nodeType === Node.TEXT_NODE) {
                const current = (textNode.textContent || "").trim();
                textNode.textContent = " " + translateLocationToArabic(current);
              }
            }

            // Force Arabic CTA label
            const cta = card.querySelector(".card-cta");
            if (cta) cta.textContent = "عرض المطعم";
          });
        } catch (e) {}
      }

      document.addEventListener("DOMContentLoaded", renderRestaurants);
    </script>
  </body>
</html>
