<!DOCTYPE html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="theme-color"
      content="#f0f0f0"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#0b0c0c"
      media="(prefers-color-scheme: dark)"
    />
    <title>Yas Island Dining — Centered English</title>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        color-scheme: light dark;
        -webkit-color-scheme: light dark;
      }

      /* Center horizontally and vertically */
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f0f0f0;
        font-family: "Segoe UI", Roboto, "Helvetica Neue", "Arial", sans-serif;
      }

      /* Dark theme styles */
      @media (prefers-color-scheme: dark) {
        body {
          background: #0b0c0c !important;
        }

        .greeting {
          color: #e7ebd4 !important;
          background: transparent !important;
          box-shadow: none !important;
        }
      }

      /* iOS Safari specific fixes */
      @supports (-webkit-touch-callout: none) {
        body {
          -webkit-text-size-adjust: 100%;
        }

        @media (prefers-color-scheme: dark) {
          body {
            background: #0b0c0c !important;
          }

          .greeting {
            color: #e7ebd4 !important;
            background: transparent !important;
            box-shadow: none !important;
          }
        }
      }

      .greeting {
        font-size: 4rem; /* adjust size as needed */
        font-weight: 700;
        line-height: 1;
        text-align: center;
        color: #1f2937;
        padding: 0.5rem 1rem;
        border-radius: 12px;
        background: #f0f0f0;
        transition: all 0.3s ease;
      }

      /* JavaScript-controlled dark mode classes */
      .dark-mode body {
        background: #0b0c0c !important;
      }

      .dark-mode .greeting {
        color: #e7ebd4 !important;
        background: transparent !important;
        box-shadow: none !important;
      }
    </style>
  </head>
  <body>
    <div class="greeting">Yas Island Dining</div>

    <script>
      // Function to detect and apply color scheme
      function applyColorScheme() {
        const isDarkMode = window.matchMedia(
          "(prefers-color-scheme: dark)"
        ).matches;
        const html = document.documentElement;

        if (isDarkMode) {
          html.classList.add("dark-mode");
        } else {
          html.classList.remove("dark-mode");
        }
      }

      // Apply color scheme on page load
      applyColorScheme();

      // Listen for color scheme changes
      if (window.matchMedia) {
        const mediaQuery = window.matchMedia("(prefers-color-scheme: dark)");

        // For older browsers that don't support addEventListener
        if (mediaQuery.addListener) {
          mediaQuery.addListener(applyColorScheme);
        } else if (mediaQuery.addEventListener) {
          mediaQuery.addEventListener("change", applyColorScheme);
        }
      }

      // Force update on iOS Safari
      if (/iPad|iPhone|iPod/.test(navigator.userAgent)) {
        // Additional iOS-specific handling
        setTimeout(applyColorScheme, 100);
        setTimeout(applyColorScheme, 500);

        // Listen for visibility change (when user switches apps and comes back)
        document.addEventListener("visibilitychange", function () {
          if (!document.hidden) {
            setTimeout(applyColorScheme, 100);
          }
        });
      }
    </script>
  </body>
</html>
