    <script>
      // Function to detect and apply color scheme
      function applyColorScheme() {
        const isDarkMode = window.matchMedia(
          "(prefers-color-scheme: dark)"
        ).matches;
        const html = document.documentElement;
        const body = document.body;

        if (isDarkMode) {
          html.classList.add("dark-mode");
          body.style.setProperty("--bg-color", "#0b0c0c");
          body.style.setProperty("--text-color", "#ffffff");
          body.style.setProperty("--text-secondary", "#cccccc");
          body.style.setProperty("--card-bg", "#1a1a1a");
        } else {
          html.classList.remove("dark-mode");
          body.style.removeProperty("--bg-color");
          body.style.removeProperty("--text-color");
          body.style.removeProperty("--text-secondary");
          body.style.removeProperty("--card-bg");
        }
      }

      // Apply color scheme on page load
      document.addEventListener("DOMContentLoaded", applyColorScheme);
      applyColorScheme();

      // Listen for color scheme changes
      if (window.matchMedia) {
        const mediaQuery = window.matchMedia("(prefers-color-scheme: dark)");

        // For older browsers that don't support addEventListener
        if (mediaQuery.addListener) {
          mediaQuery.addListener(applyColorScheme);
        } else if (mediaQuery.addEventListener) {
          mediaQuery.addEventListener("change", applyColorScheme);
        }
      }

      // Force update on iOS Safari
      if (/iPad|iPhone|iPod/.test(navigator.userAgent)) {
        // Additional iOS-specific handling
        setTimeout(applyColorScheme, 100);
        setTimeout(applyColorScheme, 500);

        // Listen for visibility change (when user switches apps and comes back)
        document.addEventListener("visibilitychange", function () {
          if (!document.hidden) {
            setTimeout(applyColorScheme, 100);
          }
        });
      }

      // Additional fallback for immediate application
      window.addEventListener("load", applyColorScheme);
    </script>

          "منتجع سانت ريجيس جزيرة السعديات",
        "Rixos Premium Saadiyat Island": "ريكسوس بريميوم جزيرة السعديات",
        "Jumeirah at Saadiyat Island Resort": "جميرا في جزيرة السعديات",
        "Saadiyat Rotana Resort & Villas": "منتجع وفلل السعديات روتانا",
        "The Ritz-Carlton Abu Dhabi": "الريتز-كارلتون أبوظبي",
        "Fairmont Bab Al Bahr, Abu Dhabi": "فيرمونت باب البحر، أبوظبي",
        "Marriott Al Forsan Abu Dhabi": "ماريوت الفرسان أبوظبي",
        "Dusit Thani Abu Dhabi": "دوسِت تاني أبوظبي",
        "Staybridge Suites Abu Dhabi - Yas Island":
          "ستايبريدج سويتس أبوظبي - جزيرة ياس",
        "Yas Plaza Marina by IHG": "ياس بلازا مارينا من آي إتش جي",
        "Yas Plaza Circuit by IHG": "ياس بلازا سيركت من آي إتش جي",
        "Radisson Blu Abu Dhabi, Yas Island": "راديسون بلو أبوظبي، جزيرة ياس",
        "Park Inn by Radisson Abu Dhabi, Yas Island":
          "بارك إن من راديسون أبوظبي، جزيرة ياس",
        "DoubleTree by Hilton Abu Dhabi Yas Island Residences":
          "دبل تري من هيلتون ريزيدنسز جزيرة ياس",
        "Hilton Abu Dhabi – Yas Island": "هيلتون أبوظبي – جزيرة ياس",
        "W Abu Dhabi – Yas Island": "دبليو أبوظبي – جزيرة ياس",
        "Crowne Plaza Abu Dhabi - Yas Island": "كراون بلازا أبوظبي - جزيرة ياس",
        "The WB Abu Dhabi, Curio Collection by Hilton":
          "فندق دبليو بي أبوظبي، كوريو كولكشن من هيلتون",
      };

      function arabizeTitle(text) {
        if (!text) return "";
        return HOTEL_TITLE_AR_MAP[text] || text;
      }

      function arabizeLocation(text) {
        if (!text) return "";
        let out = String(text);
        const reps = [
          [/(?:^|\b)abu dhabi(?:\b|$)/gi, "أبوظبي"],
          [/(?:^|\b)dubai(?:\b|$)/gi, "دبي"],
          [/(?:^|\b)uae(?:\b|$)/gi, "الإمارات العربية المتحدة"],
          [/united arab emirates/gi, "الإمارات العربية المتحدة"],
          [/west corniche/gi, "الكورنيش الغربي"],
          [/corniche road/gi, "شارع الكورنيش"],
          [/khalifa street/gi, "شارع خليفة"],
          [/sheikh rashid bin saeed street/gi, "شارع الشيخ راشد بن سعيد"],
          [/hazza bin zayed street/gi, "شارع حمدان بن زايد"],
          [/al khaleej al arabi street/gi, "شارع الخليج العربي"],
          [/airport road/gi, "طريق المطار"],
          [/mina road/gi, "طريق الميناء"],
          [/channel street/gi, "شارع القناة"],
          [/capital centre/gi, "كابيتال سنتر"],
          [/tourist club area/gi, "منطقة النادي السياحي"],
          [/al markaziyah district/gi, "حي المركزية"],
          [/al bateen/gi, "البطين"],
          [/al danah/gi, "الدانة"],
          [/zone\s*1/gi, "المنطقة ١"],
          [/yas island/gi, "جزيرة ياس"],
          [/saadiyat island/gi, "جزيرة السعديات"],
          [/al saadiyat island/gi, "جزيرة السعديات"],
          [/west corniche road/gi, "طريق الكورنيش الغربي"],
          [/corniche/gi, "الكورنيش"],
          [/street/gi, "شارع"],
          [/road/gi, "طريق"],
          [/area/gi, "منطقة"],
          [/island/gi, "جزيرة"],
          [/district/gi, "حي"],
          [/city/gi, "مدينة"],
          [/centre|center/gi, "سنتر"],
        ];
        reps.forEach(([r, a]) => {
          out = out.replace(r, a);
        });
        out = out.replace(/,\s*/g, "، ");
        return out.trim();
      }

      // Lightweight rules-based translator to Arabic for common hotel blurbs
      function translateDescriptionToArabic(text) {
        if (!text) return "";
        let out = String(text);

        // Normalize spaces
        out = out.replace(/\s+/g, " ").trim();

        // Common phrase mappings (case-insensitive)
        const replacements = [
          { r: /set amidst lush gardens/gi, a: "يقع بين حدائق غنّاء" },
          { r: /set (?:on|along)/gi, a: "يقع" },
          { r: /located/gi, a: "يقع" },
          { r: /features?/gi, a: "يضم" },
          { r: /boasts?/gi, a: "يتميز بـ" },
          { r: /offers?/gi, a: "يوفر" },
          { r: /with direct access to/gi, a: "مع وصول مباشر إلى" },
          { r: /a private beach/gi, a: "شاطئاً خاصاً" },
          { r: /private beach/gi, a: "شاطئ خاص" },
          { r: /rooftop pool/gi, a: "مسبح على السطح" },
          { r: /pools?/gi, a: "مسابح" },
          { r: /a luxe spa|a luxurious spa|luxury spa/gi, a: "سبا فاخر" },
          { r: /a spa/gi, a: "سبا" },
          { r: /restaurants? and bars?/gi, a: "مطاعم وبارات" },
          { r: /top-rated restaurants? and bars?/gi, a: "مطاعم وبارات رفيعة" },
          { r: /kids'? club/gi, a: "نادي أطفال" },
          {
            r: /ideal for business and leisure travelers/gi,
            a: "مثالي لمسافري الأعمال والترفيه",
          },
          { r: /short walk/gi, a: "على مسافة قصيرة سيراً" },
          { r: /minutes? walk/gi, a: "على بُعد دقائق سيراً" },
          { r: /minutes? (?:away|from)/gi, a: "على بُعد دقائق من" },
          { r: /close to/gi, a: "بالقرب من" },
          { r: /award-winning/gi, a: "حائز على جوائز" },
          { r: /iconic/gi, a: "أيقوني" },
          { r: /five-star|5\-star/gi, a: "خمسة نجوم" },
          { r: /four-star|4\-star/gi, a: "أربع نجوم" },
          { r: /guests can enjoy/gi, a: "يمكن للضيوف الاستمتاع" },
          { r: /largest health club/gi, a: "أكبر نادي صحي" },
          { r: /waterpark/gi, a: "حديقة مائية" },
        ];
        replacements.forEach(({ r, a }) => {
          out = out.replace(r, a);
        });

        // Number words to Arabic-Indic digits
        const words = {
          one: 1,
          two: 2,
          three: 3,
          four: 4,
          five: 5,
          six: 6,
          seven: 7,
          eight: 8,
          nine: 9,
          ten: 10,
          eleven: 11,
          twelve: 12,
        };
        out = out.replace(
          /\b(one|two|three|four|five|six|seven|eight|nine|ten|eleven|twelve)\b/gi,
          (m) => {
            const d = words[m.toLowerCase()];
            return toArabicDigits(String(d));
          }
        );

        // Convert any remaining Western digits to Arabic-Indic
        out = toArabicDigits(out);

        // Replace connectors and punctuation
        out = out
          .replace(/\sand\s/gi, " و ")
          .replace(/,\s*/g, "، ")
          .replace(/\s*\.+$/g, ".");

        // Replace hotel brand names to Arabic inside the sentence
        Object.keys(HOTEL_TITLE_AR_MAP).forEach((en) => {
          const ar = HOTEL_TITLE_AR_MAP[en];
          const rx = new RegExp(
            en.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"),
            "gi"
          );
          out = out.replace(rx, ar);
        });

        // Apply Arabic location tokens inside description too
        out = arabizeLocation(out);

        // Remove any leftover Latin segments to keep Arabic-only output
        out = out.replace(/[A-Za-z][A-Za-z\s'&\-/]*/g, "");
        out = out.replace(/\s{2,}/g, " ").trim();
        return out;
      }

      function arabizeDescription(text) {
        return translateDescriptionToArabic(text);
      }

      function renderRestaurants() {
        const grid = document.querySelector(".cards-grid");
        const subtitle = document.querySelector(".explore-subtitle");
        if (!grid) return;
        const data = readInlineData() || restaurantsData;
        grid.innerHTML = "";
        data.forEach((item) => {
          grid.appendChild(createCardNode(item));
        });
        if (subtitle) {
          const n = data.length || 0;
          subtitle.textContent = `${toArabicDigits(n)} ${hotelWord(n)}`;
        }
      }

      document.addEventListener("DOMContentLoaded", renderRestaurants);
    </script>
  </body>
